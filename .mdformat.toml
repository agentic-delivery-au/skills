# mdformat configuration — https://mdformat.readthedocs.io
# Read by the pre-commit hook, editor integrations, and manual `mdformat .` runs.

wrap = 100          # wrap prose at 100 columns
end_of_line = "lf"

# release-please owns every CHANGELOG.md and rewrites it, so formatting one
# starts a tug of war. Needs Python 3.13+: below that mdformat refuses to run at
# all rather than ignoring the key, and tells you to delete this line.
exclude = ["**/CHANGELOG.md"]
